spring.application.name=colocation

spring.datasource.url=jdbc:h2:mem:colocation;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=info

# 운영 기준값 (프로젝트 개요 2.3 미정 사항의 기본안)
colocation.rack.default-units=42
colocation.rack.half-units=21
colocation.rack.default-power-watts=10000
colocation.rack.install-cost=300000000
colocation.pricing.cpu-price-per-unit=150000
colocation.pricing.gpu-price-per-watt=400
colocation.pricing.half-rack-fee=2800000
colocation.pricing.full-rack-fee=5000000
colocation.relocation.discount-percent=50
colocation.relocation.discount-months=3
colocation.power.upgrade-step-watts=5000
colocation.power.upgrade-step-cost=100000000
colocation.notification.simulated-latency-ms=300
colocation.seed.enabled=true
colocation.zone=Asia/Seoul
